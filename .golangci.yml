version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - misspell
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1005 # error strings are user-facing CLI output
        - -QF1001

formatters:
  enable:
    - gofmt
